[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careergraph"
version = "0.1.0"
description = "Multi-agent RAG system for grounded resume Q&A and job-description gap analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mihul Bairagi" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3",
    "langgraph>=0.2.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
careergraph-ingest = "careergraph.ingestion.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# SIM simplify, C4 comprehensions, ARG unused args, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "ARG", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends(...) in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]  # pytest fixtures are injected but often unused by name

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: hits the real Anthropic API; excluded from CI",
]
